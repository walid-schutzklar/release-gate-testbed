name: T1 OIDC Claim
on: { push: { branches: ['t1/oidc-claim'] } }
permissions: {}
jobs:
  oidc-identity:
    runs-on: ubuntu-latest
    permissions: { id-token: write, actions: read, checks: read }
    steps:
      - name: Quelle A - OIDC check_run_id (Fehlschlag = DATEN_UNVOLLSTAENDIG)
        run: |
          set -uo pipefail
          TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=schutzklar-test-t1" | jq -r '.value')" || { echo "DATEN_UNVOLLSTAENDIG: Token"; exit 3; }
          [ -n "${TOKEN}" ] && [ "${TOKEN}" != "null" ] || { echo "DATEN_UNVOLLSTAENDIG: kein Token"; exit 3; }
          echo "::add-mask::${TOKEN}"
          PAYLOAD="$(printf '%s' "${TOKEN}" | cut -d. -f2)"; echo "::add-mask::${PAYLOAD}"
          pad(){ s="$1"; m=$(( ${#s} % 4 )); if [ $m -eq 2 ]; then s="${s}=="; elif [ $m -eq 3 ]; then s="${s}="; fi; printf '%s' "$s"; }
          CLAIMS="$(pad "${PAYLOAD}" | tr '_-' '/+' | base64 -d 2>/dev/null)" || { echo "DATEN_UNVOLLSTAENDIG: base64"; exit 3; }
          echo "${CLAIMS}" | jq -e . >/dev/null 2>&1 || { echo "DATEN_UNVOLLSTAENDIG: JSON"; exit 3; }
          jq -n --argjson c "${CLAIMS}" '{check_run_id:$c.check_run_id, repository_id:$c.repository_id, run_id:$c.run_id, run_attempt:$c.run_attempt, workflow_ref:$c.workflow_ref, workflow_sha:$c.workflow_sha, ref:$c.ref, event_name:$c.event_name, sha:($c.sha // null), iat:$c.iat, nbf:$c.nbf, exp:$c.exp}' > oidc_claims.json
          CRID="$(jq -r '.check_run_id // empty' oidc_claims.json)"
          case "$CRID" in ''|*[!0-9]*) echo "DATEN_UNVOLLSTAENDIG: check_run_id fehlt oder nicht numerisch"; exit 3;; esac
          for k in repository_id run_id run_attempt workflow_ref workflow_sha ref event_name sha; do
            v="$(jq -r --arg k "$k" '.[$k] // empty' oidc_claims.json)"
            [ -n "$v" ] || { echo "DATEN_UNVOLLSTAENDIG: Provenienz-Claim $k fehlt"; exit 3; }
          done
          echo "a=${CRID}" >> "$GITHUB_OUTPUT"
        id: a
      - name: Quelle B/C - genau EIN Job
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" > jobs.json
          N="$(jq '.jobs | length' jobs.json)"; [ "$N" = "1" ] || { echo "STOPP: ${N} Jobs"; exit 2; }
          jq '.jobs[0] | {id, check_run_url, name}' jobs.json > job.json
          echo "b=$(jq -r .id job.json)" >> "$GITHUB_OUTPUT"
          echo "c=$(jq -r '.check_run_url | split("/") | last' job.json)" >> "$GITHUB_OUTPUT"
          echo "cr_url=$(jq -r .check_run_url job.json)" >> "$GITHUB_OUTPUT"
        id: bc
      - name: Quelle D - Commit-Liste vollstaendig (filter=all, Pagination, app_id)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          gh api --paginate --slurp -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?filter=all&per_page=100&app_id=15368" > pages.json
          TOTAL="$(jq '.[0].total_count' pages.json)"; jq '[.[].check_runs[]]' pages.json > all.json
          LOADED="$(jq 'length' all.json)"; [ "$LOADED" = "$TOTAL" ] || { echo "STOPP: ${LOADED}!=${TOTAL}"; exit 2; }
          jq --arg u "${{ steps.bc.outputs.cr_url }}" '[.[] | select(.url==$u)]' all.json > matched.json
          M="$(jq 'length' matched.json)"; [ "$M" = "1" ] || { echo "STOPP: Treffer ${M}"; exit 2; }
          echo "d=$(jq -r '.[0].id' matched.json)" >> "$GITHUB_OUTPUT"
        id: d
      - name: Vergleich und Belege ins Log
        run: |
          set -euo pipefail
          jq -n --arg a "${{ steps.a.outputs.a }}" --arg b "${{ steps.bc.outputs.b }}" \
                --arg c "${{ steps.bc.outputs.c }}" --arg d "${{ steps.d.outputs.d }}" \
            '{A_oidc:$a,B_job_id:$b,C_url_id:$c,D_checks_id:$d, all_equal:(($a==$b) and ($b==$c) and ($c==$d))}' > t1_comparison.json
          echo "==== oidc_claims.json ===="; cat oidc_claims.json
          echo "==== t1_comparison.json ===="; cat t1_comparison.json
