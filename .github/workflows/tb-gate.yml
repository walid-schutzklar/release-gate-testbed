name: TB Release Gate

# Zwei Pflichtpruefungen fuer das Testobjekt. Ihr Ergebnis steuert allein
# gate-control.json im geprueften Commit; so laesst sich jeder Messfall
# (M1, M2, M5) mit einem eigenen Commit herstellen, ohne Testcode zu aendern.
# Keine Geheimnisse, keine Schreibrechte, Actions auf Commit-SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-a:
    name: TB Gate A
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate auswerten
        env:
          GATE: TB Gate A
          VERSUCH: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash .github/gate.sh

  gate-b:
    name: TB Gate B
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate auswerten
        env:
          GATE: TB Gate B
          VERSUCH: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash .github/gate.sh
