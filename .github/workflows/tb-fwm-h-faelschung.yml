name: TB FW-M h Faelschung

# FW-M Fall (h) im Testobjekt (synthetisch): erzeugt absichtlich einen
# Check-Run unter dem Pruefnamen "TB Gate A" fuer den Ziel-Commit aus
# fwm/h-ziel.txt, mit dem Token des Laufs (Quelle GitHub Actions). Laeuft
# ausschliesslich bei Push auf den Messzweig fwm/h-faelschung, nie auf main.
# Keine Geheimnisse.

on:
  push:
    branches: ['fwm/h-faelschung']

permissions: {}

jobs:
  faelschung:
    name: TB FW-M h Faelschung
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check-Run unter einem Pruefnamen erzeugen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ziel="$(tr -d '[:space:]' < fwm/h-ziel.txt)"
          echo "ZIEL=$ziel"
          id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name='TB Gate A' -f head_sha="$ziel" -f status=completed -f conclusion=success -f 'output[title]=FW-M Fall h' -f 'output[summary]=Absichtlich erzeugter Check-Run unter einem Pruefnamen (synthetisch)' --jq .id)"
          echo "FAELSCHUNG_CHECK_RUN=$id"
          echo "FAELSCHUNG (ID, Name, SHA, App, App-Kurzname, Status, Ergebnis, angelegt):"
          gh api "repos/$GITHUB_REPOSITORY/check-runs/$id" --jq '[.id,.name,.head_sha,.app.id,.app.slug,.status,.conclusion,.started_at] | @tsv'
